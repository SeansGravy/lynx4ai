[package]
name = "lynx-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Sean Gray <sean@rhmc.io>"]
license = "MIT"
description = "MCP server for AI browser automation via Chrome DevTools Protocol"
repository = "https://github.com/SeansGravy/lynx-mcp"
keywords = ["mcp", "browser", "automation", "ai", "cdp"]
categories = ["development-tools", "web-programming"]

[[bin]]
name = "lynx-mcp"
path = "src/main.rs"

[lib]
name = "lynx_mcp"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "1.1", features = ["server", "transport-io"] }
schemars = "1.0"
chromiumoxide = { version = "0.9", default-features = false }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "signal", "sync", "fs", "io-util", "process"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "6"

[dev-dependencies]
tempfile = "3"
